image: rust:stable

stages:
  - check
  - test

variables:
  CARGO_TERM_COLOR: always

format:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

test:
  stage: test
  script:
    - cargo test --all-targets
