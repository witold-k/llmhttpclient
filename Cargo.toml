[package]
name = "llmhttpclient"
version = "0.1.0"
edition = "2024"
authors = ["Witold Kaminski"]
description = "HTTP client for LLM chat-completion requests"
license = "Apache-2.0"
repository = "https://github.com/witold-k/llmhttpclient"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.3", features = ["json"] }
